name: Update formula

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the formula at the latest npm release
        run: |
          VERSION="$(npm view @tobilu/qmd version)"
          URL="https://registry.npmjs.org/@tobilu/qmd/-/qmd-$VERSION.tgz"
          SHA256="$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"$URL\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            Formula/qmd.rb
          git diff

      - name: Install and test
        run: |
          brew tap daanrongen/qmd
          brew trust --tap daanrongen/qmd || true
          cp Formula/qmd.rb "$(brew --repository daanrongen/qmd)/Formula/qmd.rb"
          brew install daanrongen/qmd/qmd
          brew test daanrongen/qmd/qmd

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/qmd.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "qmd v$VERSION"
          git push
