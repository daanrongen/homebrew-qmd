name: Update formula

# Push a tag matching a published @tobilu/qmd version, e.g. `git tag v2.8.4 && git push origin v2.8.4`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point the formula at the tagged npm release
        run: |
          VERSION="${VERSION#v}"
          URL="https://registry.npmjs.org/@tobilu/qmd/-/qmd-$VERSION.tgz"
          SHA256="$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"$URL\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            Formula/qmd.rb
          git diff

      - name: Install and test
        run: |
          brew tap daanrongen/qmd
          brew trust --tap daanrongen/qmd || true
          cp Formula/qmd.rb "$(brew --repository daanrongen/qmd)/Formula/qmd.rb"
          brew install daanrongen/qmd/qmd
          brew test daanrongen/qmd/qmd

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/qmd.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "qmd v$VERSION"
          git push origin HEAD:main

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
